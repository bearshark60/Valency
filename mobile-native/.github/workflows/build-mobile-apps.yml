name: Build Native Mobile Apps (Android APK & iOS Archive)

on:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build Mobile Web Bundle & Sync Capacitor Android
        working-directory: mobile-native
        run: |
          npm install
          npm run build:web
          npx cap add android
          npx cap sync android
      - name: Assemble Debug APK (Sideloadable on Android Phones)
        working-directory: mobile-native/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: valency-android-debug-apk
          path: mobile-native/android/app/build/outputs/apk/debug/app-debug.apk

  build-ios-xcarchive:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Mobile Web Bundle & Sync Capacitor iOS
        working-directory: mobile-native
        run: |
          npm install
          npm run build:web
          npx cap add ios
          npx cap sync ios
      - name: Build Unsigned iOS Archive (requires Apple Developer signing for TestFlight / App Store .ipa)
        working-directory: mobile-native/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -archivePath "$PWD/build/VALENCY.xcarchive" archive
      - uses: actions/upload-artifact@v4
        with:
          name: valency-ios-unsigned-xcarchive
          path: mobile-native/ios/App/build/VALENCY.xcarchive

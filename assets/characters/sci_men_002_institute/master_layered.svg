<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 896 1200" width="896" height="1200" data-character-id="sci_men_002_institute" data-ai-family="INSTITUTE" data-generation="INSTITUTE_HOLOGRAM" data-art-tier="PRODUCTION_PAINTERLY">
  <title>SCI-MEN-002-INST — Institute AI Hologram: Dmitri Mendeleev (Production Painterly 16-Layer Rig)</title>
  <defs>

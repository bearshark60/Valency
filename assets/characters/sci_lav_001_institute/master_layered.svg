          <g data-part="lid_lower">
            <rect x="330" y="405" width="86" height="18" fill="#c7d5de" opacity="0.9" />
          </g>
        </g>
      </g>

      <g id="layer_eye_right" data-layer="layer_eye_right">
        <g clip-path="url(#lavI_clipEyeRight)">
          <g data-part="sclera"></g>
          <g data-part="iris">

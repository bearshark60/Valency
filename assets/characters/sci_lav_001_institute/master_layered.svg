  <!-- ==================== LAYER 16: CLEAN VOLUMETRIC MUSEUM HOLOGRAM SCANLINES ==================== -->
  <g id="layer_fx_reconstruction" data-layer="layer_fx_reconstruction" opacity="0.45">
    <rect x="0" y="0" width="896" height="1200" fill="url(#lavI_scanlines)" />

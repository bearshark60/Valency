        <image href="assets/characters/sci_lav_001_institute/layers/04_face_head.png" x="0" y="0" width="896" height="1200" />
      </g>
      <g id="layer_jaw_lower" data-layer="layer_jaw_lower">
        <image href="assets/characters/sci_lav_001_institute/layers/12_jaw_lower.png" x="0" y="0" width="896" height="1200" />
      </g>

      <!-- Left & Right Symmetrical Painted Eyes -->
      <g id="layer_eye_left" data-layer="layer_eye_left">
        <g clip-path="url(#lavI_clipEyeLeft)">

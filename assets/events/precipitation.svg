  </defs>
  <rect width="240" height="160" fill="url(#bg)"/>
  <ellipse cx="120" cy="132" rx="80" ry="32" fill="url(#goldGlow)"/>
  <!-- Sleek Lab Beaker -->
  <path d="M62 24 L178 24 L172 134 C172 142 164 146 154 146 L86 146 C76 146 68 142 68 134 Z"

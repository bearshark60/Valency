    <polygon points="122,62 129,71 122,80 115,71"/>
    <polygon points="148,72 154,80 148,88 142,80"/>
    <polygon points="106,90 113,99 106,108 99,99"/>
    <polygon points="134,88 141,97 134,106 127,97"/>
    <polygon points="84,96 89,103 84,110 79,103"/>
    <polygon points="156,98 161,105 156,112 151,105"/>
  </g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1526"/>
      <stop offset="100%" stop-color="#1b1830"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="240" height="160" fill="url(#bg)"/>
  <circle cx="120" cy="80" r="72" fill="url(#halo)"/>
  <!-- Outer calm protective resonance aura -->
  <circle cx="120" cy="80" r="58" fill="none" stroke="#fde047" stroke-width="1.8" stroke-dasharray="8 5" opacity="0.65"/>
  <!-- Benzene Hexagon Ring -->
  <polygon points="120,34 160,57 160,103 120,126 80,103 80,57"
           fill="rgba(56,189,248,0.12)" stroke="#38bdf8" stroke-width="3.2"/>
  <!-- Inner Delocalized Pi-Electron Resonance Circle -->
  <circle cx="120" cy="80" r="26" fill="none" stroke="#facc15" stroke-width="4" opacity="0.92"/>
  <circle cx="120" cy="80" r="26" fill="none" stroke="#fef9c3" stroke-width="1.4" stroke-dasharray="5 5"/>
  <!-- Six glowing carbon vertices -->
  <g fill="#0ea5e9" stroke="#e0f2fe" stroke-width="2">
    <circle cx="120" cy="34" r="8"/>
    <circle cx="160" cy="57" r="8"/>
    <circle cx="160" cy="103" r="8"/>
    <circle cx="120" cy="126" r="8"/>
    <circle cx="80" cy="103" r="8"/>
    <circle cx="80" cy="57" r="8"/>
  </g>
  <!-- Center serene star -->
  <circle cx="120" cy="80" r="5" fill="#fef08a"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1529"/>
      <stop offset="100%" stop-color="#1b1430"/>
    </linearGradient>
    <linearGradient id="goldArrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="cyanArrow" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>
  <rect width="240" height="160" fill="url(#bg)"/>
  <!-- Glowing swirling balance halo -->
  <ellipse cx="120" cy="80" rx="86" ry="50" fill="none" stroke="rgba(148,163,184,0.22)" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- Left Reactant Cluster -->
  <circle cx="48" cy="66" r="14" fill="#0284c7" stroke="#bae6fd" stroke-width="2"/>
  <circle cx="58" cy="100" r="11" fill="#38bdf8" stroke="#e0f2fe" stroke-width="1.6"/>
  <!-- Right Product Cluster -->
  <line x1="184" y1="74" x2="198" y2="96" stroke="#fde047" stroke-width="3.2"/>
  <circle cx="184" cy="74" r="14" fill="#d97706" stroke="#fef3c7" stroke-width="2"/>
  <circle cx="198" cy="96" r="11" fill="#facc15" stroke="#fef9c3" stroke-width="1.6"/>
  <!-- Iconic Reversible Equilibrium Double Harpoon Arrows -->
  <path d="M84 68 L156 68 L142 54" fill="none" stroke="url(#goldArrow)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M156 92 L84 92 L98 106" fill="none" stroke="url(#cyanArrow)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Center energy glow -->
  <circle cx="120" cy="80" r="5" fill="#ffffff" opacity="0.9"/>
</svg>
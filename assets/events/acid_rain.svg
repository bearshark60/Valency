<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1912"/>
      <stop offset="55%" stop-color="#132a1b"/>
      <stop offset="100%" stop-color="#1c3b14"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="76%" r="48%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9f99d"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="240" height="160" fill="url(#bg)"/>
  <ellipse cx="120" cy="126" rx="95" ry="42" fill="url(#glow)"/>
  <!-- Storm clouds -->
  <g fill="#0f2419" opacity="0.9">
    <ellipse cx="45" cy="16" rx="52" ry="22"/>
    <ellipse cx="118" cy="10" rx="64" ry="24"/>
    <ellipse cx="195" cy="18" rx="54" ry="22"/>
  </g>
  <!-- Corrosive steam wisps -->
  <g fill="#bef264" opacity="0.22" filter="url(#blur)">
    <circle cx="88" cy="118" r="18"/>
    <circle cx="122" cy="112" r="22"/>
    <circle cx="155" cy="120" r="16"/>
  </g>
  <!-- Dissolving crystal lattice molecule -->
  <g stroke="#86efac" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.8">
    <line x1="76" y1="126" x2="118" y2="108"/>
    <line x1="118" y1="108" x2="162" y2="124"/>
    <line x1="118" y1="108" x2="120" y2="142"/>
  </g>
  <g>
    <circle cx="76" cy="126" r="11" fill="#166534" stroke="#bbf7d0" stroke-width="1.8"/>
    <circle cx="118" cy="108" r="14" fill="#3f6212" stroke="#d9f99d" stroke-width="2"/>
    <circle cx="162" cy="124" r="11" fill="#166534" stroke="#bbf7d0" stroke-width="1.8"/>
    <circle cx="120" cy="142" r="9" fill="#14532d" stroke="#86efac" stroke-width="1.5" opacity="0.7"/>
  </g>
  <!-- Acid rain streaks & droplets -->
  <g stroke="#bef264" stroke-linecap="round" opacity="0.75">
    <line x1="38" y1="30" x2="28" y2="62" stroke-width="2"/>
    <line x1="68" y1="24" x2="56" y2="66" stroke-width="2.2"/>
    <line x1="102" y1="28" x2="90" y2="76" stroke-width="2.4"/>
    <line x1="138" y1="22" x2="126" y2="72" stroke-width="2.4"/>
    <line x1="172" y1="30" x2="160" y2="74" stroke-width="2.2"/>
    <line x1="205" y1="26" x2="195" y2="64" stroke-width="2"/>
  </g>
  <g fill="url(#drop)">
    <path d="M56 76 C56 76 50 86 50 90 A6 6 0 1 0 62 90 C62 86 56 76 56 76Z"/>
    <path d="M96 62 C96 62 91 71 91 74.5 A5 5 0 1 0 101 74.5 C101 71 96 62 96 62Z"/>
    <path d="M144 68 C144 68 138 79 138 83 A6 6 0 1 0 150 83 C150 79 144 68 144 68Z"/>
    <path d="M186 78 C186 78 181 87 181 90.5 A5 5 0 1 0 191 90.5 C191 87 186 78 186 78Z"/>
  </g>
  <!-- Splash rings -->
  <g fill="none" stroke="#d9f99d" stroke-width="1.5" opacity="0.85">
    <ellipse cx="118" cy="95" rx="14" ry="4"/>
    <ellipse cx="76" cy="116" rx="9" ry="3"/>
    <ellipse cx="162" cy="114" rx="10" ry="3"/>
  </g>
</svg>
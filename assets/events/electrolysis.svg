<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#09152a"/>
      <stop offset="100%" stop-color="#0d2642"/>
    </linearGradient>
    <linearGradient id="bath" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.68"/>
    </linearGradient>
  </defs>
  <rect width="240" height="160" fill="url(#bg)"/>
  <!-- Electrolytic Cell Tank -->
  <rect x="28" y="42" width="184" height="104" rx="10" fill="url(#bath)" stroke="#93c5fd" stroke-width="2.2"/>
  <line x1="30" y1="58" x2="210" y2="58" stroke="#7dd3fc" stroke-width="1.6" opacity="0.6"/>
  <!-- Left Cathode & Right Anode Electrodes -->
  <rect x="54" y="14" width="16" height="106" rx="4" fill="#cbd5e1" stroke="#f8fafc" stroke-width="1.6"/>
  <rect x="170" y="14" width="16" height="106" rx="4" fill="#64748b" stroke="#cbd5e1" stroke-width="1.6"/>
  <!-- Electric Current Arcs Splitting Molecule -->
  <polyline points="70,84 96,74 106,92 134,76 146,90 170,82" fill="none" stroke="#c084fc" stroke-width="6" stroke-linecap="round" opacity="0.65"/>
  <polyline points="70,84 96,74 106,92 134,76 146,90 170,82" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Pulled Stolen Atom migrating to Electrode -->
  <circle cx="96" cy="88" r="14" fill="#a855f7" stroke="#f3e8ff" stroke-width="2"/>
  <circle cx="152" cy="96" r="11" fill="#0284c7" stroke="#bae6fd" stroke-width="1.6" opacity="0.75"/>
  <!-- Rising electrolysis gas bubbles -->
  <g fill="#e0f2fe" opacity="0.85">
    <circle cx="62" cy="64" r="3.5"/>
    <circle cx="76" cy="70" r="2.5"/>
    <circle cx="50" cy="78" r="3"/>
    <circle cx="178" cy="66" r="3.5"/>
    <circle cx="164" cy="72" r="2.5"/>
    <circle cx="190" cy="80" r="3"/>
  </g>
</svg>
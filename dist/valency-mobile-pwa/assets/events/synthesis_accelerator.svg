<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1026"/>
      <stop offset="100%" stop-color="#221238"/>
    </linearGradient>
    <radialGradient id="accelGlow" cx="50%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.7"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="240" height="160" fill="url(#bg)"/>
  <circle cx="120" cy="80" r="76" fill="url(#accelGlow)"/>
  <!-- Twin Hyper-Speed Orbital Accelerator Rings -->
  <ellipse cx="120" cy="80" rx="88" ry="34" fill="none" stroke="#38bdf8" stroke-width="3.2" transform="rotate(-20 120 80)" opacity="0.88"/>
  <ellipse cx="120" cy="80" rx="88" ry="34" fill="none" stroke="#facc15" stroke-width="3.2" transform="rotate(20 120 80)" opacity="0.88"/>
  <!-- Speed streak arcs -->
  <ellipse cx="120" cy="80" rx="64" ry="24" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-dasharray="16 14" transform="rotate(-20 120 80)"/>
  <ellipse cx="120" cy="80" rx="64" ry="24" fill="none" stroke="#fef08a" stroke-width="1.4" stroke-dasharray="16 14" transform="rotate(20 120 80)"/>
  <!-- Twin Converging Accelerated Atoms + Central Fusion Core -->
  <circle cx="52" cy="54" r="9.5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="188" cy="106" r="9.5" fill="#facc15" stroke="#ffffff" stroke-width="2"/>
  <circle cx="120" cy="80" r="16" fill="#ffffff" stroke="#facc15" stroke-width="3.5"/>
  <circle cx="120" cy="80" r="7" fill="#38bdf8"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071b24"/>
      <stop offset="100%" stop-color="#0b2c2a"/>
    </linearGradient>
    <radialGradient id="archGlow" cx="50%" cy="68%" r="55%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="240" height="160" fill="url(#bg)"/>
  <ellipse cx="120" cy="112" rx="98" ry="52" fill="url(#archGlow)"/>
  <!-- Wide Protective Buffer Dome shielding multiple molecules -->
  <path d="M22 132 A98 84 0 0 1 218 132 Z" fill="rgba(45,212,191,0.14)" stroke="#2dd4bf" stroke-width="3.2"/>
  <path d="M36 132 A84 70 0 0 1 204 132" fill="none" stroke="#99f6e4" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.7"/>
  <!-- Protected Field Molecules safely inside -->
  <g stroke="#7dd3fc" stroke-width="2">
    <line x1="72" y1="112" x2="88" y2="100"/>
    <line x1="88" y1="100" x2="104" y2="112"/>
    <line x1="142" y1="108" x2="168" y2="108"/>
  </g>
  <circle cx="88" cy="100" r="9" fill="#0284c7" stroke="#e0f2fe" stroke-width="1.5"/>
  <circle cx="72" cy="112" r="6.5" fill="#38bdf8" stroke="#e0f2fe" stroke-width="1.2"/>
  <circle cx="104" cy="112" r="6.5" fill="#38bdf8" stroke="#e0f2fe" stroke-width="1.2"/>
  <circle cx="142" cy="108" r="8.5" fill="#f59e0b" stroke="#fef3c7" stroke-width="1.4"/>
  <circle cx="168" cy="108" r="8.5" fill="#22c55e" stroke="#dcfce7" stroke-width="1.4"/>
  <!-- Hostile red droplets deflecting harmlessly off the dome rim -->
  <g fill="#f43f5e" stroke="#fecdd3" stroke-width="1">
    <path d="M56 26 C56 26 51 34 51 37 A5 5 0 1 0 61 37 C61 34 56 26 56 26Z"/>
    <path d="M120 14 C120 14 115 22 115 25 A5 5 0 1 0 125 25 C125 22 120 14 120 14Z"/>
    <path d="M184 26 C184 26 179 34 179 37 A5 5 0 1 0 189 37 C189 34 184 26 184 26Z"/>
  </g>
  <!-- Deflection ripples on dome surface -->
  <g fill="none" stroke="#99f6e4" stroke-width="1.8">
    <ellipse cx="120" cy="48" rx="16" ry="4"/>
    <ellipse cx="64" cy="64" rx="12" ry="4" transform="rotate(-28 64 64)"/>
    <ellipse cx="176" cy="64" rx="12" ry="4" transform="rotate(28 176 64)"/>
  </g>
</svg>
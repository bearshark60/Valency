<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171429"/>
      <stop offset="100%" stop-color="#0b192c"/>
    </linearGradient>
    <radialGradient id="goldOrb" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>
    <radialGradient id="cyanOrb" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#075985"/>
    </radialGradient>
  </defs>
  <rect width="240" height="160" fill="url(#bg)"/>
  <!-- Cascading shockwave rings -->
  <circle cx="48" cy="80" r="24" fill="none" stroke="#fde047" stroke-width="1.5" opacity="0.4"/>
  <circle cx="116" cy="52" r="22" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
  <circle cx="122" cy="112" r="22" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.4"/>
  <!-- Branching energy rays -->
  <g stroke="#fde047" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="48" y1="80" x2="116" y2="52"/>
    <line x1="48" y1="80" x2="122" y2="112"/>
  </g>
  <g stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
    <line x1="116" y1="52" x2="188" y2="30"/>
    <line x1="116" y1="52" x2="196" y2="76"/>
    <line x1="122" y1="112" x2="196" y2="76"/>
    <line x1="122" y1="112" x2="190" y2="132"/>
  </g>
  <!-- Cascading orbs -->
  <circle cx="48" cy="80" r="17" fill="url(#goldOrb)" stroke="#fef9c3" stroke-width="2"/>
  <circle cx="116" cy="52" r="14" fill="url(#cyanOrb)" stroke="#e0f2fe" stroke-width="1.8"/>
  <circle cx="122" cy="112" r="14" fill="url(#goldOrb)" stroke="#fef9c3" stroke-width="1.8"/>
  <circle cx="188" cy="30" r="11" fill="url(#goldOrb)" stroke="#fef9c3" stroke-width="1.5"/>
  <circle cx="196" cy="76" r="12" fill="url(#cyanOrb)" stroke="#e0f2fe" stroke-width="1.5"/>
  <circle cx="190" cy="132" r="11" fill="url(#goldOrb)" stroke="#fef9c3" stroke-width="1.5"/>
</svg>
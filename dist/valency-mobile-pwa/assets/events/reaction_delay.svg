<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081b2e"/>
      <stop offset="50%" stop-color="#0c3454"/>
      <stop offset="100%" stop-color="#082032"/>
    </linearGradient>
    <radialGradient id="frostGlow" cx="50%" cy="54%" r="48%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="240" height="160" fill="url(#bg)"/>
  <circle cx="120" cy="84" r="78" fill="url(#frostGlow)"/>
  <!-- Ice crystal shards framing the flask -->
  <g fill="url(#ice)" stroke="#bae6fd" stroke-width="1.2">
    <polygon points="36,144 62,62 84,136"/>
    <polygon points="204,144 176,58 156,136"/>
    <polygon points="68,148 90,88 112,148" opacity="0.7"/>
    <polygon points="172,148 150,90 128,148" opacity="0.7"/>
  </g>
  <!-- Frozen Erlenmeyer Flask -->
  <path d="M106 30 L134 30 L130 58 L160 122 C164 130 158 138 148 138 L92 138 C82 138 76 130 80 122 L110 58 Z"
        fill="rgba(186,230,253,0.18)" stroke="#e0f2fe" stroke-width="2.4"/>
  <!-- Frozen liquid inside -->
  <path d="M94 98 L146 98 L158 122 C161 129 156 135 148 135 L92 135 C84 135 79 129 82 122 Z"
        fill="#38bdf8" opacity="0.62"/>
  <!-- Suspended frozen molecules/bubbles -->
  <g fill="#f0f9ff" opacity="0.9">
    <circle cx="108" cy="116" r="4"/>
    <circle cx="128" cy="112" r="5.5"/>
    <circle cx="118" cy="126" r="3"/>
    <circle cx="136" cy="124" r="3.5"/>
    <circle cx="116" cy="80" r="3.5" opacity="0.7"/>
    <circle cx="126" cy="68" r="2.5" opacity="0.6"/>
  </g>
  <!-- Frost crystal star overlay -->
  <g stroke="#e0f2fe" stroke-width="1.8" stroke-linecap="round" opacity="0.9">
    <line x1="120" y1="68" x2="120" y2="104"/>
    <line x1="104" y1="77" x2="136" y2="95"/>
    <line x1="136" y1="77" x2="104" y2="95"/>
  </g>
  <!-- Drifting frost crystals -->
  <g fill="#bae6fd" opacity="0.8">
    <polygon points="44,34 48,40 44,46 40,40"/>
    <polygon points="196,36 200,42 196,48 192,42"/>
    <polygon points="168,28 171,33 168,38 165,33"/>
    <polygon points="72,42 75,47 72,52 69,47"/>
  </g>
</svg>